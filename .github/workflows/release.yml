name: Build & Release Ear Scope

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI tab

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd windows
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Standalone Executable
        run: |
          cd windows
          pyinstaller --noconfirm --onefile --windowed --clean `
            --name "EarScope-Windows" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --paths "." `
            itimo_gui.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarScope-Windows
          path: windows/dist/EarScope-Windows.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Automatically installs Gradle on runner; acts as fallback if wrapper jar is missing
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android APK
        run: |
          cd android
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease || ./gradlew assembleDebug
          else
            gradle assembleRelease || gradle assembleDebug
          fi

      - name: Find and Stage APK
        run: |
          mkdir -p staging
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found after build!" && exit 1
          fi
          cp "$APK_PATH" staging/EarScope-Android.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarScope-Android
          path: staging/EarScope-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') # Only publish release when triggered by a tag
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: EarScope-Windows
          path: release-assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: EarScope-Android
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/EarScope-Windows.exe
            release-assets/EarScope-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}