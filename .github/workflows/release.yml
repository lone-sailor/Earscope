name: Build & Release Ear Scope

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd windows
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Standalone Executable
        run: |
          cd windows
          pyinstaller --noconfirm --onefile --windowed --clean `
            --name "EarScope-Windows" `
            --icon "icon.ico" `
            --add-data "icon.ico;." `
            --paths "." `
            itimo_gui.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarScope-Windows
          path: windows/dist/EarScope-Windows.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug

      - name: Find and Stage APK
        run: |
          mkdir -p staging
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} staging/EarScope-Android.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarScope-Android
          path: staging/EarScope-Android.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: EarScope-Windows
          path: release-assets/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: EarScope-Android
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/EarScope-Windows.exe
            release-assets/EarScope-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}